name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"] # rama por defecto
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    # Vinculamos este trabajo directamente al entorno de producción de GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build
        env:
          SITE_URL: https://dgarcia024.github.io/

      # 1. Empaqueta la carpeta de compilación generada por pnpm (ej: Vite)
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      # 2. Realiza el despliegue real usando el artefacto anterior
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
