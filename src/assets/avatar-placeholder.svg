<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <style>
      @keyframes pulseGlow {
        0%, 100% { 
          filter: drop-shadow(0 0 4px #14d4c9); 
          opacity: 0.8;
        }
        50% { 
          filter: drop-shadow(0 0 16px #14d4c9) drop-shadow(0 0 24px #14d4c9); 
          opacity: 1;
        }
      }
      @keyframes rotateRing {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes pulseOpacity {
        0%, 100% { opacity: 0.4; }
        50% { opacity: 0.8; }
      }
      .initials {
        font-family: monospace;
        font-size: 64px;
        font-weight: 700;
        fill: #e2e8f0;
        animation: pulseGlow 2.5s ease-in-out infinite;
      }
      .ring {
        fill: none;
        stroke: #14d4c9;
        stroke-width: 2;
        stroke-dasharray: 10 6;
        animation: rotateRing 15s linear infinite, pulseOpacity 3s ease-in-out infinite;
        transform-origin: 100px 100px;
      }
      .bg-ring {
        fill: none;
        stroke: #1e2c44;
        stroke-width: 1.5;
      }
    </style>
  </defs>
  
  <!-- Background circle -->
  <circle cx="100" cy="100" r="98" fill="#020617" stroke="#1e2c44" stroke-width="2"/>
  
  <!-- Outer rotating ring -->
  <circle class="ring" cx="100" cy="100" r="92" />
  
  <!-- Inner subtle ring -->
  <circle class="bg-ring" cx="100" cy="100" r="55"/>
  
  <!-- Initials DG -->
  <text class="initials" x="100" y="112" text-anchor="middle" dominant-baseline="middle">DG</text>
</svg>